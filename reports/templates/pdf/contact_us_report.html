{% load customtags %}
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
    <head>
        <title>Subscription Report</title>
        <style type="text/css">
            @page {
                size: Letter landscape;
                margin: 1cm;
            }
            body {
                font-weight: 200;
                font-size: 11.5px;
            }
            .header {
                font-size: 20px;
                font-weight: 100;
                text-align: center;
                color: #007cae;
            }
            .title {
                font-size: 22px;
                font-weight: 100;
               /* text-align: right;*/
               padding: 10px 20px 0px 20px;  
            }
            .title span {
                color: #007cae;
            }
            .details {
                padding: 10px 20px 0px 20px;
                text-align: left !important;
                /*margin-left: 40%;*/
            }
            .hrItem {
                border: none;
                height: 1px;
                /* Set the hr color */
                color: #333; /* old IE */
                background-color: #fff; /* Modern Browsers */
            }
            table {
                border-collapse: collapse;
                border-spacing: 0;
                width: 100%;
                border: 1px solid #ddd;
                }

                th, td {
                text-align: left;
                padding: 3px;
                }

                tr:nth-child(even) {
                    background-color: #f2f2f2;
                }
        </style>
    </head>
    <body>
        <style>
            #header,
            #footer {
              padding: 0 !important;
            }
          </style>
          <table style="width: 100%; padding-left: 0px; padding-right: 0px; padding-top: 5px;padding-bottom: 8px;margin: 0px!important;font-size: 15px; border:0;">
            <tr>
              <td style="text-align:left; width:25%!important;">
                <div>
                    <img height="42" src="https://storage.googleapis.com/instalearn-public-bucket/media/landing/instalogo.png" alt="">
                </div>
              </td>
              <td style="text-align:center; width:50%!important;font-size: 17px; color: #007cae;">
                <div>
                    <p class='title'>Contact Us Report </p>
                </div>
              </td>
              <td style="text-align:right; width:25%!important;font-size: 14px">
                <div>
                    {{ready_score|today_date}}
                </div>
              </td>
            </tr>
          </table>

        <div class='wrapper'>
            
        <div class='details'>
            <div>
                <table style="padding-top: 70px;">
                    <tr>
                        <td>
                            <b>First Name</b>
                        </td>
                        <td>
                            <b>Last Name</b>
                        </td>
                        <td width="20%">
                            <b>Email</b>
                        </td>
                        <td>
                            <b>Phone</b>
                        </td>
                        <td>
                            <b>Message</b>
                        </td>
                        <td>
                            <b>Created At</b>
                        </td>
                    </tr>
                    {% for user in  info %}
                    <tr>
                        <td width="10%">
                            {{user.first_name}}
                        </td>
                        <td width="10%">
                            {{user.last_name}}
                        </td>
                        <td width="20%">
                            {{user.email}}
                        </td>
                        <td>{{user.phone}}</td>
                        <td>{{user.message}}</td>
                        <td>{{user.created_at}}</td>
                        
                    </tr>
                    {% endfor %}
                </table>
            </div>
            <div class='wrapper'>
                <div>
                    <h2>&nbsp;</h2>
                </div>
            <div>
        </div>
        
    </div>
    </body>
</html>
