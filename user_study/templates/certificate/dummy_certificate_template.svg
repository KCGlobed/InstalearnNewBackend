<svg width="1200" height="850" viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="850" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="810" fill="none" stroke="#d4af37" stroke-width="8"/>
  <rect x="40" y="40" width="1120" height="770" fill="none" stroke="#d4af37" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-size="48" font-family="Georgia" font-weight="bold">CERTIFICATE OF COMPLETION</text>
  <text x="600" y="200" text-anchor="middle" font-size="22">This certificate is proudly presented to</text>
  <text x="600" y="310" text-anchor="middle" font-size="56" font-family="Georgia" font-weight="bold">{{name}}</text>
  <line x1="300" y1="330" x2="900" y2="330" stroke="#d1d5db" stroke-width="2"/>
  <text x="600" y="400" text-anchor="middle" font-size="24">For successfully completing the course</text>
  <text x="600" y="470" text-anchor="middle" font-size="22" font-family="Georgia" font-weight="bold" fill="#2563eb">{{course_name}}</text>
  <text x="600" y="540" text-anchor="middle" font-size="20">Awarded on {{date}}</text>
  <line x1="180" y1="680" x2="380" y2="680" stroke="#374151" stroke-width="2"/>
  <text x="280" y="710" text-anchor="middle" font-size="18">Instructor Signature</text>
  <line x1="820" y1="680" x2="1020" y2="680" stroke="#374151" stroke-width="2"/>
  <text x="920" y="710" text-anchor="middle" font-size="18">Director Signature</text>
  <text x="600" y="780" text-anchor="middle" font-size="16">Certificate ID: {{certificate_id}}</text>
</svg>