{% extends "base.html" %}

{% block title %}Create & Update SubCategory{% endblock %}

{% block content %}

    <div class="nxl-content">
            <!-- [ page-header ] start -->
            <div class="page-header">
                <div class="page-header-left d-flex align-items-center">
                    <div class="page-header-title">
                        <h5 class="m-b-10">Create New SubCategory</h5>
                    </div>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Home</a></li>
                        <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Manage SubCategory</a></li>
                        <li class="breadcrumb-item">Create New SubCategory</li>
                    </ul>
                </div>
                
            </div>
            <!-- [ page-header ] end -->
            <!-- [ Main Content ] start -->
            <div class="main-content">
                <div class="row">
                    <div class="col-8 offset-2">
                        <div class="card stretch stretch-full">
                            <div class="card-body">
                                <div class="mb-4">
                                    <h3>Create New SubCategory</h3>
                                </div>
                                
                                <form id="categoryForm" method="POST" >
                                    {% csrf_token %}
                                    <input type="hidden" name="id" value="{% if category_detail %}{{category_detail.id}}{% endif%}">
                                    <div class="mb-4">
                                        <label class="form-label">Title <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" placeholder="Title" name="name" value="{% if category_detail %}{{category_detail.name}}{% endif%}" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Parent Category <span class="text-danger">*</span></label>
                                        <select class="form-control" name="parent" required>
                                            <option value="">Select Parent Category</option>
                                            {% for parent_category in parent_category_listing %}
                                                <option value="{{parent_category.id}}"
                                                    {% if category_detail %}
                                                        {% if category_detail.parent.id == parent_category.id %}
                                                            selected
                                                        {% endif%}
                                                    {% endif%}
                                                >{{parent_category.name}}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="mb-4">
                                            <label class="form-label">Description <span class="text-danger">*</span></label>
                                            <textarea type="text" class="form-control" placeholder="Description" name="description" value="" required>{% if category_detail %}{{category_detail.description}}{% endif%}</textarea>
                                        </div>
                                    <div class="d-flex justify-content-end gap-2 mt-3">
                                        <a href="{% url 'admin-manage-subcategory' %}" class="btn bg-soft-info text-info">Back</a>
                                        <button tyep="submit" class="btn btn-primary ladda-button" data-style="expand-right" id="saveCategoryBtn">Submit</button>
                                    </div>
                                </form>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
            <!-- [ Main Content ] end -->
        </div>
    

{% endblock %}

{% block scripts %}
    
<script>
    $(document).ready(function () {
    
        $("#categoryForm").validate({
            errorClass: "error text-danger",
            submitHandler: function (form, event) {
                event.preventDefault();

                var l = Ladda.create(document.querySelector('#saveCategoryBtn'));
                l.start();

                $.ajax({
                    url: "{% url 'admin-create-subcategory' %}",
                    type: "POST",
                    data: $(form).serialize(), 
                    success: function (response) {
                        t.fire("Success!", response.message, "success");

                        {% if not category_detail %}
                            form.reset();
                        {% endif%}

                    },
                    error: function () {
                        t.fire("Error!", "Something went wrong.", "error");
                    },
                    complete: function () {
                        l.stop();
                    }
                });
            }
        });
    });

</script>

{% endblock %}
