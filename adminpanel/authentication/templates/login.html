{% extends "auth.html" %}

{% block title %}Instalearn || Login{% endblock %}

{% block content %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>

    <div class="auth-creative-inner">
        <div class="creative-card-wrapper">
            <div class="card my-4 overflow-hidden" style="z-index: 1">
                <div class="row flex-1 g-0">
                    <div class="col-lg-6 h-100 my-auto order-1 order-lg-0">
                        <div class="wd-50 bg-white p-2 rounded-circle shadow-lg position-absolute translate-middle top-50 start-50 d-none d-lg-block">
                            <img src="https://storage.googleapis.com/static_files_backend/media/adminpanel/assets/images/logo/logo.png" alt="" class="img-fluid">
                        </div>
                        <div class="creative-card-body card-body p-sm-5">
                            <h2 class="fs-20 fw-bolder mb-4">Login</h2>
                            <h4 class="fs-13 fw-bold mb-2">Login to your account</h4>
                            <p class="fs-12 fw-medium text-muted">Thank you for get back <strong>Instalearn</strong>
                            </p>
                            <form action="#" id="signup-form" class="w-100 mt-4 pt-2" method="post">
                                <div class="mb-4">
                                    <input type="email" class="form-control" placeholder="Enter Email" required>
                                </div>
                                <div class="mb-3">
                                    <input type="password" class="form-control" placeholder="Enter Password" required>
                                </div>
                                <div class="mb-3">
                                    <select class="form-control">
                                        <option>Select Role</option>
                                        {% for roles in roles_data %}
                                            <option value="{{roles}}">{{roles}}</option>
                                        {% endfor %}

                                    </select>
                                </div>
                                <div class="d-flex align-items-center justify-content-between">
                                    <div>
                                        
                                    </div>
                                    <div>
                                        <a href="auth-reset-creative.html" class="fs-11 text-primary">Forget password?</a>
                                    </div>
                                </div>
                                <div class="mt-5">
                                    <button type="submit" class="btn btn-lg btn-primary w-100">Login</button>
                                </div>
                            </form>
                            
                        </div>
                    </div>
                    <div class="col-lg-6 bg-primary order-0 order-lg-1">
                        <div class="h-100 d-flex align-items-center justify-content-center">
                            <img src="https://storage.googleapis.com/static_files_backend/media/adminpanel/assets/images/auth/auth-user.png" alt="" class="img-fluid">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
   <script>
  $(document).ready(function () {
    $("form").validate({
      submitHandler: function (form) {
        form.submit();
      }
 
    });
  });
</script>

{% endblock %}

{% block scripts %}
    
    

{% endblock %}
